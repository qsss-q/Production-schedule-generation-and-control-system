spring:
  application:
    name: coke_factory
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coke_factory_db}
    username: ${SPRING_DATASOURCE_USERNAME:dev_operator}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      encoding: UTF-8

springdoc:
  swagger-ui:
    tryItOutEnabled: true