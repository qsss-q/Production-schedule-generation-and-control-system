version: '3.8'
services:
  coke-postgres-db:
    image: postgres:15-alpine
    container_name: coke_factory_database
    environment:
      - POSTGRES_DB=coke_factory_db
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=dev_operator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Добавляем ваше Java-приложение сюда:
  coke-app:
    build: .  # Docker будет искать Dockerfile в этой же папке
    container_name: coke_factory_app
    ports:
      - "8080:8080"
    depends_on:
      - coke-postgres-db  # Ждем, пока запустится база
    environment:
      # Передаем адрес базы данных внутрь контейнера
      - SPRING_DATASOURCE_URL=jdbc:postgresql://coke-postgres-db:5432/coke_factory_db
      - SPRING_DATASOURCE_USERNAME=dev_operator
      - SPRING_DATASOURCE_PASSWORD=secret

volumes:
  postgres_data:
