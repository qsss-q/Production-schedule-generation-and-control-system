# Вся система одной командой:  docker compose up --build
#   фронт   -> http://localhost:5173
#   Swagger -> http://localhost:8080/swagger-ui.html
services:
  coke-postgres-db:
    image: postgres:15-alpine
    container_name: coke_factory_database
    environment:
      - POSTGRES_DB=coke_factory_db
      - POSTGRES_PASSWORD=secret
      - POSTGRES_USER=dev_operator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # приложение стартует только когда PostgreSQL реально готов принимать запросы
      test: ["CMD-SHELL", "pg_isready -U dev_operator -d coke_factory_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  coke-app:
    build: .
    container_name: coke_factory_app
    ports:
      - "8080:8080"
    depends_on:
      coke-postgres-db:
        condition: service_healthy
    restart: on-failure
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://coke-postgres-db:5432/coke_factory_db
      - SPRING_DATASOURCE_USERNAME=dev_operator
      - SPRING_DATASOURCE_PASSWORD=secret

  coke-front:
    build:
      # Фронт лежит в этом же репозитории, в папке frontend/.
      context: ./frontend
    container_name: coke_factory_front
    ports:
      - "5173:80"
    depends_on:
      - coke-app
    restart: on-failure

volumes:
  postgres_data:
