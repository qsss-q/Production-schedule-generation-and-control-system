server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Встроенный DNS Docker: имя сервиса бэкенда определяется при каждом запросе,
    # поэтому nginx стартует, даже если бэкенд ещё запускается
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Все запросы фронта к API идут на бэкенд (так же, как прокси в vite.config.js)
    location /api/ {
        set $backend http://coke-app:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Всё остальное — страницы фронта
    location / {
        try_files $uri /index.html;
    }
}
